services:
  - type: web
    name: edge-setter
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && node script/build.mjs
    startCommand: node dist/index.cjs
    healthCheckPath: /api/signals
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: PORT
        fromGroup: edge-setter-env
      - key: BASE_URL
        fromGroup: edge-setter-env
      - key: SUPABASE_URL
        fromGroup: edge-setter-env
      - key: SUPABASE_ANON_KEY
        fromGroup: edge-setter-env
      - key: STRIPE_SECRET_KEY
        fromGroup: edge-setter-env
      - key: STRIPE_PRO_PRICE_ID
        fromGroup: edge-setter-env
      - key: STRIPE_WEBHOOK_SECRET
        fromGroup: edge-setter-env
      - key: RESEND_API_KEY
        fromGroup: edge-setter-env
      - key: ADMIN_PASSWORD
        fromGroup: edge-setter-env
      - key: FROM_EMAIL
        fromGroup: edge-setter-env
      - key: BALLDONTLIE_API_KEY
        fromGroup: edge-setter-env
    disk:
      name: edge-setter-data
      mountPath: /var/data
      sizeGB: 1
