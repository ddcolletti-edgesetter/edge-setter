name: tests

# Typecheck + the test suite on every PR.
#
# Until this job existed, CI ran four narrow guards and nothing else: no
# `npm test`, and nothing at all under client/src. That gap is how #97 merged
# green while turning story-card-injury-player-kickoff red on main — #97
# branched before #96, so the two PRs merged with no textual conflict and a
# case #97 could not see began asserting a player chip #97 had just taught the
# card to drop.
#
# The guard workflows stay as they are. They are scoped to one subject each and
# report separately, which is what makes a red guard legible; this job is the
# broad net underneath them, and the overlap costs seconds.

on:
  # No `branches:` filter on pull_request. That filter matches the BASE branch,
  # and this repo ships stacked PRs (#87 → #88 → #89), so `branches: [main]`
  # reports no checks at all on any PR based on another branch in the stack.
  # The same reasoning is written out in cfb-game-alias-guard.yml.
  pull_request:
  push:
    branches: [main]

# Read-only. No secrets are referenced and nothing is written outside the
# runner: checkout, npm ci, tsc, one vitest run.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsconfig.json already sets noEmit, so this is `npm run check` with the
      # flag written out rather than implied.
      - name: Typecheck
        run: npx tsc --noEmit

      # Four suites are skipped here and nowhere else: they still run locally and
      # none of them is modified, because all four are red for reasons about the
      # runner rather than the code under test. Every one of them asserts against
      # ambient state or a real wall clock, which a shared 2-vCPU runner does not
      # reproduce in either direction — it is both slower under contention and,
      # against an empty DB, faster per statement.
      #
      # replay-parity-regression: reads ambient pipeline.db state, so a fresh checkout has outcomes=0 and trips its own `total > 0` anti-vacuity assert.
      # db-diagnostics: asserts a 1ms interval timer gets a turn during estimateRowCounts, which an empty DB finishes too fast to allow.
      # boot-cycle-loop-lag: asserts the worst leaf step owns >=70% of the worst span, but runner deschedule lands in the glue between steps and is charged only to the enclosing cycle (measured 17/34ms and 20/49ms on this runner, green locally).
      # situations-worker-in-flight: assumes a 6,000,000-row recursive CTE outlives two 500ms reads, and when the runner finishes it first the in-flight clock restarts on the next statement (runningMs went 500 -> 63).
      #
      # node_modules and dist are repeated because --exclude REPLACES vitest's
      # default exclude list rather than adding to it; without them the run
      # walks node_modules.
      - name: Run the suite
        run: >
          npx vitest run
          --exclude '**/node_modules/**'
          --exclude '**/dist/**'
          --exclude '**/replay-parity-regression.test.ts'
          --exclude '**/db-diagnostics.test.ts'
          --exclude '**/boot-cycle-loop-lag.test.ts'
          --exclude '**/situations-worker-in-flight.test.ts'
